<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sophia's store 🛍️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff5fb;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 0 4px 16px #ffb6d9;
    }
    header h1 {
      font-size: 2.8rem;
      color: #fff;
      text-shadow: 2px 2px 0 #c2185b;
      letter-spacing: 2px;
    }
    header p {
      color: #ffe0f0;
      font-size: 1.1rem;
      margin-top: 0.4rem;
    }

    .back-btn {
      display: inline-block;
      margin: 1.2rem 1.5rem;
      padding: 0.5rem 1.2rem;
      background: #ff69b4;
      color: #fff;
      border-radius: 2rem;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
    }
    .back-btn:hover { background: #ff1493; }

    .shop-intro {
      text-align: center;
      padding: 0.5rem 1rem 1rem;
      font-size: 1.15rem;
      color: #c2185b;
      font-weight: bold;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.6rem;
      padding: 1rem 2rem 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .item-card {
      background: #fff;
      border: 3px solid #ffb6d9;
      border-radius: 1.4rem;
      overflow: hidden;
      box-shadow: 0 4px 18px #ffd6ef;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }
    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px #ffb6d9;
    }

    .item-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #fff5fb;
    }

    .item-info {
      padding: 1rem 1.2rem 1.3rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #c2185b;
    }

    .item-desc {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.4;
      flex: 1;
    }

    .item-price {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff1493;
    }

    .buy-btn {
      margin-top: 0.5rem;
      padding: 0.6rem 1rem;
      background: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .buy-btn:hover { background: #ff1493; }

    /* modal */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff;
      border: 4px solid #ff69b4;
      border-radius: 1.6rem;
      padding: 2rem 2.5rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 40px #ffb6d9;
    }
    .modal h2 { font-size: 1.8rem; color: #ff1493; margin-bottom: 0.6rem; }
    .modal p { font-size: 1rem; color: #666; line-height: 1.5; }
    .modal-close {
      margin-top: 1.4rem;
      padding: 0.6rem 1.8rem;
      background: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-close:hover { background: #ff1493; }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #ffb6d9;
      font-size: 0.9rem;
    }
  </style>
</head>

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = items.map((item, i) => `
        <div class="item-card">
          <img src="${item.img}" alt="${item.name}" />
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">${item.price}</div>
            <button class="buy-btn" onclick="buy(${i})">💖 i want this!!</button>
          </div>
        </div>
      `).join('');
    }

    function buy(i) {
      document.getElementById('modal-bg').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-bg').classList.remove('open');
    }

    document.getElementById('modal-bg').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    renderItems();
