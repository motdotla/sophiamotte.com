<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wally! 🐶</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #fde8f0;
        color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1.5rem; padding: 1rem 1rem 3rem;
        min-height: 100vh;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 2rem; font-weight: normal; letter-spacing: 0.2em; margin-top: 4rem; }
      .subtitle { font-size: 0.85rem; color: #e91e8c99; letter-spacing: 0.1em; }
      .facts {
        background: #fff0f5; border: 3px solid #e91e8c; border-radius: 1rem;
        box-shadow: 0 0 14px #ffb6d9; padding: 1.2rem 1.5rem;
        width: min(480px, 94vw); display: flex; flex-direction: column; gap: 0.6rem;
      }
      .facts h2 { font-size: 1rem; font-weight: normal; letter-spacing: 0.1em; color: #e91e8c; }
      .fact { font-size: 0.9rem; line-height: 1.6; }
      .gallery {
        display: grid; grid-template-columns: repeat(2, 1fr);
        gap: 1rem; width: min(480px, 94vw);
      }
      .gallery img {
        width: 100%; border-radius: 1rem;
        border: 3px solid #f5c800; box-shadow: 0 0 12px #ffb6d9;
        object-fit: cover; aspect-ratio: 3/4;
      }
      .gallery img.wide {
        grid-column: span 2; aspect-ratio: 4/3;
      }
    </style>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>🐶 wally!</h1>
    <p class="subtitle">~ sophia's crazy puppy ~</p>

    <div class="facts">
      <h2>🐾 facts about wally</h2>
      <p class="fact">🎂 age: about 8 months old</p>
      <p class="fact">💨 hobby: getting the zoomies when sophia comes home from school!</p>
      <p class="fact">🦌 favorite costume: reindeer (obviously)</p>
      <p class="fact">🏃 personality: super crazy and full of love!!</p>
    </div>

    <div class="gallery">
      <img src="photos/wally1.jpeg" alt="Wally in a wreath" />
      <img src="photos/wally2.jpeg" alt="Wally as a reindeer" />
      <img src="photos/wally3.jpeg" alt="Wally doing a head tilt" class="wide" />
    </div>
  </body>
</html>
