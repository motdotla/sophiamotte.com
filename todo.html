<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sophia's to-do list 💕</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background-color: #fde8f0;
        color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 5rem 1rem 2rem;
        gap: 1.5rem;
      }

      .tabs {
        position: fixed;
        top: 0.5rem;
        left: 0.5rem;
        right: 0.5rem;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .play-tab {
        background: #f5c800;
        color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem;
        font-weight: bold;
        letter-spacing: 0.1em;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        text-decoration: none;
        border: 2px solid #e91e8c;
        box-shadow: 0 0 10px #ffb6d9;
      }

      .play-tab:hover {
        background: #e91e8c;
        color: #fff;
      }

      h1 {
        font-size: 1.8rem;
        letter-spacing: 0.15em;
        font-weight: normal;
        text-align: center;
      }

      .card {
        background: #fff0f7;
        border: 2px solid #f5c800;
        border-radius: 1rem;
        box-shadow: 0 0 16px #ffb6d9;
        padding: 1.5rem;
        width: min(480px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .add-row {
        display: flex;
        gap: 0.5rem;
      }

      .add-row input {
        flex: 1;
        font-family: "Courier New", Courier, monospace;
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border: 2px solid #f5c800;
        border-radius: 0.5rem;
        outline: none;
        color: #c2185b;
        background: #fff;
      }

      .add-row input:focus {
        border-color: #e91e8c;
      }

      .add-row button {
        font-family: "Courier New", Courier, monospace;
        font-size: 1rem;
        font-weight: bold;
        background: #f5c800;
        color: #c2185b;
        border: 2px solid #e91e8c;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }

      .add-row button:hover {
        background: #e91e8c;
        color: #fff;
      }

      #todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.6rem;
        border-radius: 0.5rem;
        background: #fff;
        border: 2px solid #ffb6d9;
      }

      .heart-btn {
        font-size: 1.4rem;
        cursor: pointer;
        background: none;
        border: none;
        line-height: 1;
        padding: 0;
        transition: transform 0.15s;
        color: #e91e8c;
        flex-shrink: 0;
      }

      .heart-btn:hover {
        transform: scale(1.3);
      }

      .todo-text {
        flex: 1;
        font-size: 1rem;
        color: #c2185b;
        word-break: break-word;
      }

      .todo-item.done .todo-text {
        text-decoration: line-through;
        color: #e91e8c88;
      }

      .delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        color: #e91e8c66;
        padding: 0;
        flex-shrink: 0;
      }

      .delete-btn:hover {
        color: #e91e8c;
      }

      .empty-msg {
        text-align: center;
        color: #e91e8c66;
        font-size: 0.9rem;
        padding: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <a class="play-tab" href="index.html">🏠 HOME</a>
      <a class="play-tab" href="snake.html">🐍 SNAKE</a>
      <a class="play-tab" href="draw.html">🎨 DRAW</a>
      <a class="play-tab" href="match.html">💕 MATCH</a>
      <a class="play-tab" href="blocks.html">⛏️ BLOCK BUILDER</a>
    </div>

    <h1>sophia's to-do list 💕</h1>

    <div class="card">
      <div class="add-row">
        <input type="text" id="new-todo" placeholder="add something..." maxlength="100" />
        <button onclick="addTodo()">+ add</button>
      </div>
      <ul id="todo-list">
        <li class="empty-msg" id="empty-msg">no todos yet! add one above 💕</li>
      </ul>
    </div>

    <script>
      let todos = JSON.parse(localStorage.getItem('sophia-todos') || '[]');

      function save() {
        localStorage.setItem('sophia-todos', JSON.stringify(todos));
      }

      function render() {
        const list = document.getElementById('todo-list');
        const emptyMsg = document.getElementById('empty-msg');
        list.innerHTML = '';

        if (todos.length === 0) {
          list.appendChild(emptyMsg);
          return;
        }

        todos.forEach((todo, i) => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.done ? ' done' : '');

          const heartBtn = document.createElement('button');
          heartBtn.className = 'heart-btn';
          heartBtn.textContent = todo.done ? '♥' : '♡';
          heartBtn.title = todo.done ? 'mark undone' : 'mark done';
          heartBtn.onclick = () => { todos[i].done = !todos[i].done; save(); render(); };

          const span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.textContent = '✕';
          del.title = 'delete';
          del.onclick = () => { todos.splice(i, 1); save(); render(); };

          li.appendChild(heartBtn);
          li.appendChild(span);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      function addTodo() {
        const input = document.getElementById('new-todo');
        const text = input.value.trim();
        if (!text) return;
        todos.push({ text, done: false });
        save();
        render();
        input.value = '';
        input.focus();
      }

      document.getElementById('new-todo').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addTodo();
      });

      render();
    </script>
  </body>
</html>
