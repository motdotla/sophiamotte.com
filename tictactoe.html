<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe! ⭕</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0; font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem; background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace; font-size: 0.85rem; font-weight: bold;
        letter-spacing: 0.1em; padding: 0.5rem 1rem; border-radius: 0.5rem;
        text-decoration: none; border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .mode-btns { display: flex; gap: 0.5rem; }
      .board {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem; width: min(300px, 80vw);
      }
      .cell {
        aspect-ratio: 1; background: #fff0f5; border: 3px solid #e91e8c;
        border-radius: 0.75rem; display: flex; align-items: center;
        justify-content: center; font-size: 2.5rem; cursor: pointer;
        box-shadow: 0 0 8px #ffb6d9; transition: transform 0.1s;
      }
      .cell:hover:not(.taken) { transform: scale(1.05); background: #ffe0f0; }
      .cell.taken { cursor: default; }
      .cell.win { background: #ffe066; border-color: #f5c800; }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1.2rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .btn.active { background: #e91e8c; color: #fff; }
      #status { font-size: 1rem; letter-spacing: 0.08em; min-height: 1.5rem; text-align: center; }
      .score { font-size: 0.85rem; color: #e91e8c99; letter-spacing: 0.08em; }
    </style>
    <script defer src="https://1.dotenvx.com/script.js" data-website-id="d1d69339-4912-43a7-8ee9-cbcc9a58c74f"></script>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>⭕ tic tac toe!</h1>
    <div class="mode-btns">
      <button class="btn active" id="vs-friend-btn">👫 2 players</button>
      <button class="btn" id="vs-cpu-btn">🤖 vs computer</button>
    </div>
    <div class="score">💗 X: <span id="score-x">0</span> &nbsp;|&nbsp; 💛 O: <span id="score-o">0</span></div>
    <div id="status">X goes first!</div>
    <div class="board" id="board"></div>
    <button class="btn" id="reset-btn">🔄 new game</button>

    <script>
      let board, current, over, vsComputer, scores = {X:0, O:0};

      function init(mode) {
        vsComputer = mode === 'cpu';
        board = Array(9).fill('');
        current = 'X'; over = false;
        document.getElementById('status').textContent = "X goes first!";
        render();
      }

      function render() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        board.forEach((val, i) => {
          const cell = document.createElement('div');
          cell.className = 'cell' + (val ? ' taken' : '');
          cell.textContent = val === 'X' ? '💗' : val === 'O' ? '💛' : '';
          if (!val && !over) cell.addEventListener('click', () => play(i));
          b.appendChild(cell);
        });
      }

      function checkWin(b, p) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return lines.find(l => l.every(i => b[i] === p));
      }

      function play(i) {
        if (board[i] || over) return;
        board[i] = current;
        const win = checkWin(board, current);
        if (win) {
          over = true;
          scores[current]++;
          document.getElementById(`score-${current.toLowerCase()}`).textContent = scores[current];
          document.getElementById('status').textContent = `${current === 'X' ? '💗 X' : '💛 O'} wins!! 🎉`;
          win.forEach(i => document.getElementById('board').children[i].classList.add('win'));
          render(); return;
        }
        if (board.every(c => c)) {
          over = true;
          document.getElementById('status').textContent = "it's a tie! 🤝";
          render(); return;
        }
        current = current === 'X' ? 'O' : 'X';
        document.getElementById('status').textContent = `${current === 'X' ? '💗 X' : '💛 O'}'s turn!`;
        render();
        if (vsComputer && current === 'O' && !over) setTimeout(cpuMove, 400);
      }

      function cpuMove() {
        // try to win, then block, then center, then random
        const empty = board.map((v,i)=>v?-1:i).filter(i=>i>=0);
        for (const p of ['O','X']) {
          for (const i of empty) {
            const t = [...board]; t[i] = p;
            if (checkWin(t, p)) { play(i); return; }
          }
        }
        if (board[4] === '') { play(4); return; }
        play(empty[Math.floor(Math.random() * empty.length)]);
      }

      document.getElementById('vs-friend-btn').addEventListener('click', () => {
        document.getElementById('vs-friend-btn').classList.add('active');
        document.getElementById('vs-cpu-btn').classList.remove('active');
        init('friend');
      });
      document.getElementById('vs-cpu-btn').addEventListener('click', () => {
        document.getElementById('vs-cpu-btn').classList.add('active');
        document.getElementById('vs-friend-btn').classList.remove('active');
        init('cpu');
      });
      document.getElementById('reset-btn').addEventListener('click', () => init(vsComputer ? 'cpu' : 'friend'));
      init('friend');
    </script>
  </body>
</html>
