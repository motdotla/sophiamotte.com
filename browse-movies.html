    <title>sophia's movie browser 🎬</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background-color: #fde8f0;
        color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 5rem 1rem 2rem;
        gap: 1.2rem;
      }

      .tabs {
        position: fixed;
        top: 0.5rem; left: 0.5rem; right: 0.5rem;
        z-index: 10;
        display: flex; flex-wrap: wrap; gap: 0.4rem;
      }

      .play-tab {
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem;
        text-decoration: none; border: 2px solid #e91e8c;
        box-shadow: 0 0 10px #ffb6d9;
      }
      .play-tab:hover { background: #e91e8c; color: #fff; }

      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; text-align: center; }

      .search-bar {
        width: min(560px, 92vw);
        font-family: "Courier New", Courier, monospace;
        font-size: 1rem; padding: 0.6rem 1rem;
        border: 2px solid #e91e8c; border-radius: 0.75rem;
        color: #c2185b; background: #fff0f7; outline: none;
      }
      .search-bar:focus { border-color: #c2185b; }

      .filter-row {
        display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center;
        width: min(700px, 92vw);
      }

      .filter-btn {
        font-family: "Courier New", Courier, monospace;
        font-size: 0.8rem; font-weight: bold;
        padding: 0.35rem 0.8rem; border-radius: 0.5rem;
        border: 2px solid #e91e8c; background: #fff0f7;
        color: #c2185b; cursor: pointer;
      }
      .filter-btn:hover, .filter-btn.active { background: #e91e8c; color: #fff; }

      .watchlist-banner {
        display: none;
        width: min(700px, 92vw);
        background: #fff0f7; border: 2px solid #f5c800;
        border-radius: 0.75rem; padding: 0.8rem 1rem;
        box-shadow: 0 0 10px #ffb6d9;
      }
      .watchlist-banner.visible { display: block; }
      .watchlist-banner h2 { font-size: 1rem; font-weight: bold; margin-bottom: 0.5rem; }
      .watchlist-items { display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .watchlist-chip {
        background: #f5c800; color: #c2185b;
        border: 2px solid #e91e8c; border-radius: 0.4rem;
        font-size: 0.75rem; font-weight: bold; padding: 0.2rem 0.5rem;
        display: flex; align-items: center; gap: 0.3rem;
      }
      .watchlist-chip button {
        background: none; border: none; cursor: pointer;
        color: #c2185b; font-size: 0.8rem; padding: 0; line-height: 1;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
        width: min(700px, 92vw);
      }

      .card {
        background: #fff0f7;
        border: 2px solid #f5c800;
        border-radius: 1rem;
        box-shadow: 0 0 10px #ffb6d9;
        padding: 0.8rem;
        display: flex; flex-direction: column; gap: 0.4rem;
        position: relative;
      }

      .card-poster {
        font-size: 3.5rem; text-align: center;
        background: #fde8f0; border-radius: 0.6rem;
        padding: 0.5rem; line-height: 1;
      }

      .card-title {
        font-size: 0.9rem; font-weight: bold;
        color: #c2185b; line-height: 1.3;
      }

      .card-year { font-size: 0.75rem; color: #e91e8c99; }

      .card-desc {
        font-size: 0.75rem; color: #c2185b99;
        line-height: 1.4; flex: 1;
      }

      .card-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
      .tag {
        font-size: 0.65rem; padding: 0.15rem 0.4rem;
        border-radius: 0.3rem; background: #fde8f0;
        border: 1px solid #e91e8c66; color: #e91e8c;
      }

      .heart-btn {
        position: absolute; top: 0.5rem; right: 0.6rem;
        font-size: 1.3rem; background: none; border: none;
        cursor: pointer; color: #e91e8c; transition: transform 0.15s;
        line-height: 1;
      }
      .heart-btn:hover { transform: scale(1.3); }
      .heart-btn.saved { color: #e91e8c; }

      .no-results {
        color: #e91e8c66; font-size: 0.9rem; text-align: center;
        grid-column: 1/-1; padding: 2rem 0;
      }
    </style>
  </head>

      const ALL_TAGS = [...new Set(MOVIES.flatMap(m => m.tags))].sort();
      let watchlist = JSON.parse(localStorage.getItem('sophia-watchlist') || '[]');
      let activeFilter = 'all';
      let searchTerm = '';

      // build filters
      const filterRow = document.getElementById('filters');
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active'; allBtn.textContent = '💕 all';
      allBtn.onclick = () => setFilter('all', allBtn);
      filterRow.appendChild(allBtn);

      const watchBtn = document.createElement('button');
      watchBtn.className = 'filter-btn'; watchBtn.textContent = '♥ my watchlist';
      watchBtn.onclick = () => setFilter('watchlist', watchBtn);
      filterRow.appendChild(watchBtn);

      ALL_TAGS.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn'; btn.textContent = tag;
        btn.onclick = () => setFilter(tag, btn);
        filterRow.appendChild(btn);
      });

      function setFilter(f, btn) {
        activeFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      }

      document.getElementById('search').addEventListener('input', function() {
        searchTerm = this.value.toLowerCase();
        render();
      });

      function saveWatchlist() {
        localStorage.setItem('sophia-watchlist', JSON.stringify(watchlist));
      }

      function renderWatchlist() {
        const banner = document.getElementById('watchlist-banner');
        const items = document.getElementById('watchlist-items');
        items.innerHTML = '';
        if (watchlist.length === 0) { banner.classList.remove('visible'); return; }
        banner.classList.add('visible');
        watchlist.forEach(title => {
          const chip = document.createElement('div');
          chip.className = 'watchlist-chip';
          chip.innerHTML = `${title} <button onclick="removeFromWatchlist('${title.replace(/'/g,"\\'")}')">✕</button>`;
          items.appendChild(chip);
        });
      }

      function removeFromWatchlist(title) {
        watchlist = watchlist.filter(t => t !== title);
        saveWatchlist(); renderWatchlist(); render();
      }

      function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        let movies = MOVIES;

        if (searchTerm) {
          movies = movies.filter(m =>
            m.title.toLowerCase().includes(searchTerm) ||
            m.desc.toLowerCase().includes(searchTerm) ||
            m.tags.some(t => t.includes(searchTerm))
          );
        }

        if (activeFilter === 'watchlist') {
          movies = movies.filter(m => watchlist.includes(m.title));
        } else if (activeFilter !== 'all') {
          movies = movies.filter(m => m.tags.includes(activeFilter));
        }

        if (movies.length === 0) {
          const msg = document.createElement('div');
          msg.className = 'no-results';
          msg.textContent = activeFilter === 'watchlist' ? 'no movies on your watchlist yet! tap ♡ on any movie to save it.' : 'no movies found!';
          grid.appendChild(msg);
          return;
        }

        movies.forEach(movie => {
          const saved = watchlist.includes(movie.title);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <button class="heart-btn ${saved ? 'saved' : ''}" data-title="${movie.title}">${saved ? '♥' : '♡'}</button>
            <div class="card-poster">${movie.emoji}</div>
            <div class="card-title">${movie.title}</div>
            <div class="card-year">${movie.year}</div>
            <div class="card-tags">${movie.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <div class="card-desc">${movie.desc}</div>
          `;
          card.querySelector('.heart-btn').addEventListener('click', function() {
            const t = this.dataset.title;
            if (watchlist.includes(t)) {
              watchlist = watchlist.filter(x => x !== t);
              this.textContent = '♡'; this.classList.remove('saved');
            } else {
              watchlist.push(t);
              this.textContent = '♥'; this.classList.add('saved');
            }
            saveWatchlist(); renderWatchlist();
          });
          grid.appendChild(card);
        });
      }

      renderWatchlist();
      render();
    </script>
