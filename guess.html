<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guess! 🔢</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0;
        font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1.2rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .card {
        background: #fff0f5; border: 3px solid #e91e8c; border-radius: 1rem;
        box-shadow: 0 0 14px #ffb6d9; padding: 1.5rem;
        width: min(360px, 94vw); display: flex; flex-direction: column;
        align-items: center; gap: 1rem; text-align: center;
      }
      .hint { font-size: 1.3rem; letter-spacing: 0.05em; min-height: 2rem; }
      .tries { font-size: 0.85rem; color: #e91e8c99; }
      .input-row { display: flex; gap: 0.5rem; }
      input {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.2rem; padding: 0.4rem 0.8rem;
        border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; background: #fff0f5;
        text-align: center; width: 7rem; outline: none;
      }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .history { font-size: 0.8rem; color: #e91e8c99; line-height: 1.8; }
    </style>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>🔢 number guess!</h1>
    <div class="card">
      <p>i'm thinking of a number between <strong>1</strong> and <strong>100</strong>!</p>
      <div class="hint" id="hint">can you guess it? 🤔</div>
      <div class="tries">tries: <strong id="tries">0</strong></div>
      <div class="input-row">
        <input id="guess-input" type="number" min="1" max="100" placeholder="?" />
        <button class="btn" id="guess-btn">guess!</button>
      </div>
      <div class="history" id="history"></div>
      <button class="btn" id="new-btn">🔄 new number</button>
    </div>

    <script>
      let secret = Math.floor(Math.random() * 100) + 1;
      let tries = 0;

      function newGame() {
        secret = Math.floor(Math.random() * 100) + 1;
        tries = 0;
        document.getElementById('tries').textContent = 0;
        document.getElementById('hint').textContent = 'can you guess it? 🤔';
        document.getElementById('history').textContent = '';
        document.getElementById('guess-input').value = '';
        document.getElementById('guess-input').disabled = false;
        document.getElementById('guess-btn').disabled = false;
      }

      function guess() {
        const val = parseInt(document.getElementById('guess-input').value);
        if (!val || val < 1 || val > 100) return;
        tries++;
        document.getElementById('tries').textContent = tries;
        const hint = document.getElementById('hint');
        const history = document.getElementById('history');
        history.textContent = val + (val > secret ? ' ⬇️ too high!' : val < secret ? ' ⬆️ too low!' : ' ✅') + '\n' + history.textContent;
        if (val === secret) {
          hint.textContent = `🎉 yes!! it was ${secret}! you got it in ${tries} tries!!`;
          document.getElementById('guess-input').disabled = true;
          document.getElementById('guess-btn').disabled = true;
        } else if (val > secret) {
          hint.textContent = '📉 too high! go lower!';
        } else {
          hint.textContent = '📈 too low! go higher!';
        }
        document.getElementById('guess-input').value = '';
      }

      document.getElementById('guess-btn').addEventListener('click', guess);
      document.getElementById('guess-input').addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
      document.getElementById('new-btn').addEventListener('click', newGame);
    </script>
  </body>
</html>
