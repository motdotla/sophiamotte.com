<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guess! 🔢</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0;
        font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1.2rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .mode-btns { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
      .card {
        background: #fff0f5; border: 3px solid #e91e8c; border-radius: 1rem;
        box-shadow: 0 0 14px #ffb6d9; padding: 1.5rem;
        width: min(360px, 94vw); display: flex; flex-direction: column;
        align-items: center; gap: 1rem; text-align: center;
      }
      .hint { font-size: 1.3rem; letter-spacing: 0.05em; min-height: 2rem; }
      .tries { font-size: 0.85rem; color: #e91e8c99; }
      .input-row { display: flex; gap: 0.5rem; }
      input {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.2rem; padding: 0.4rem 0.8rem;
        border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; background: #fff0f5;
        text-align: center; width: 7rem; outline: none;
      }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .btn.active { background: #e91e8c; color: #fff; }
      .history { font-size: 0.8rem; color: #e91e8c99; line-height: 1.8; }
      .hint-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
      .hint-box {
        background: #fff0f5; border: 2px solid #f5c800; border-radius: 0.75rem;
        padding: 0.5rem 1rem; font-size: 0.85rem; color: #c2185b;
        text-align: center; width: 100%; min-height: 2rem;
        box-shadow: 0 0 8px #ffb6d9;
      }
      .hint-used { opacity: 0.4; cursor: default !important; }
      #pick-screen { display: none; }
      #pick-screen.visible { display: flex; }
    </style>
    <script defer src="https://1.dotenvx.com/script.js" data-website-id="d1d69339-4912-43a7-8ee9-cbcc9a58c74f"></script>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>🔢 number guess!</h1>

    <div class="mode-btns">
      <button class="btn active" id="solo-btn">🤖 vs computer</button>
      <button class="btn" id="friend-btn">👯 play with a friend!</button>
    </div>

    <!-- friend pick screen -->
    <div class="card" id="pick-screen">
      <p>🤫 player 1 — pick a secret number between <strong>1</strong> and <strong>100</strong>!</p>
      <p style="font-size:0.8rem;color:#e91e8c99;">(player 2, look away!! 👀)</p>
      <div class="input-row">
        <input id="pick-input" type="password" min="1" max="100" placeholder="shhh..." />
        <button class="btn" id="pick-btn">ready!</button>
      </div>
      <div id="pick-error" style="font-size:0.8rem;color:#e91e8c;min-height:1rem;"></div>
    </div>

    <!-- main game card -->
    <div class="card" id="game-card">
      <p id="game-desc">i'm thinking of a number between <strong>1</strong> and <strong>100</strong>!</p>
      <div class="hint" id="hint">can you guess it? 🤔</div>
      <div class="tries">tries: <strong id="tries">0</strong></div>
      <div class="input-row">
        <input id="guess-input" type="number" min="1" max="100" placeholder="?" />
        <button class="btn" id="guess-btn">guess!</button>
      </div>
      <div class="history" id="history"></div>
      <div style="font-size:0.85rem; color:#e91e8c99;">💡 hints left: <strong id="hints-left">3</strong></div>
      <div class="hint-row">
        <button class="btn" id="hint1-btn">💡 hint 1</button>
        <button class="btn" id="hint2-btn">💡 hint 2</button>
        <button class="btn" id="hint3-btn">💡 hint 3</button>
      </div>
      <div class="hint-box" id="hint-box" style="display:none;"></div>
      <button class="btn" id="new-btn">🔄 new game</button>
    </div>

    <script>
      let secret = Math.floor(Math.random() * 100) + 1;
      let tries = 0;
      let hintsUsed = 0;
      let mode = 'solo'; // 'solo' or 'friend'

      function getHints() {
        const even = secret % 2 === 0 ? 'even' : 'odd';
        const quarter = secret <= 25 ? 'between 1 and 25' : secret <= 50 ? 'between 26 and 50' : secret <= 75 ? 'between 51 and 75' : 'between 76 and 100';
        const tens = Math.floor(secret / 10);
        const tensHint = tens === 0 ? 'less than 10' : `the tens digit is ${tens} (so it's ${tens*10}-${tens*10+9})`;
        return [
          `hint 1: the number is ${even}! 🔢`,
          `hint 2: it's ${quarter}! 📍`,
          `hint 3: ${tensHint}! 🔍`,
        ];
      }

      function useHint(n) {
        const btn = document.getElementById(`hint${n}-btn`);
        if (btn.classList.contains('hint-used')) return;
        hintsUsed++;
        btn.classList.add('hint-used');
        btn.disabled = true;
        document.getElementById('hints-left').textContent = 3 - hintsUsed;
        const box = document.getElementById('hint-box');
        box.style.display = 'block';
        box.textContent = getHints()[n - 1];
      }

      function resetGameUI() {
        tries = 0;
        hintsUsed = 0;
        document.getElementById('tries').textContent = 0;
        document.getElementById('hint').textContent = 'can you guess it? 🤔';
        document.getElementById('history').textContent = '';
        document.getElementById('guess-input').value = '';
        document.getElementById('guess-input').disabled = false;
        document.getElementById('guess-btn').disabled = false;
        document.getElementById('hints-left').textContent = 3;
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('hint-box').textContent = '';
        [1,2,3].forEach(n => {
          const btn = document.getElementById(`hint${n}-btn`);
          btn.classList.remove('hint-used');
          btn.disabled = false;
        });
      }

      function newGame() {
        if (mode === 'friend') {
          // go back to pick screen
          document.getElementById('game-card').style.display = 'none';
          document.getElementById('pick-screen').classList.add('visible');
          document.getElementById('pick-input').value = '';
          document.getElementById('pick-error').textContent = '';
        } else {
          secret = Math.floor(Math.random() * 100) + 1;
          resetGameUI();
          document.getElementById('game-desc').innerHTML = `i'm thinking of a number between <strong>1</strong> and <strong>100</strong>!`;
        }
      }

      function guess() {
        const val = parseInt(document.getElementById('guess-input').value);
        if (!val || val < 1 || val > 100) return;
        tries++;
        document.getElementById('tries').textContent = tries;
        const hint = document.getElementById('hint');
        const history = document.getElementById('history');
        history.textContent = val + (val > secret ? ' ⬇️ too high!' : val < secret ? ' ⬆️ too low!' : ' ✅') + '\n' + history.textContent;
        if (val === secret) {
          hint.textContent = `🎉 yes!! it was ${secret}! you got it in ${tries} tries!!`;
          document.getElementById('guess-input').disabled = true;
          document.getElementById('guess-btn').disabled = true;
        } else if (val > secret) {
          hint.textContent = '📉 too high! go lower!';
        } else {
          hint.textContent = '📈 too low! go higher!';
        }
        document.getElementById('guess-input').value = '';
      }

      // mode switching
      document.getElementById('solo-btn').addEventListener('click', () => {
        mode = 'solo';
        document.getElementById('solo-btn').classList.add('active');
        document.getElementById('friend-btn').classList.remove('active');
        document.getElementById('pick-screen').classList.remove('visible');
        document.getElementById('game-card').style.display = 'flex';
        secret = Math.floor(Math.random() * 100) + 1;
        resetGameUI();
        document.getElementById('game-desc').innerHTML = `i'm thinking of a number between <strong>1</strong> and <strong>100</strong>!`;
      });

      document.getElementById('friend-btn').addEventListener('click', () => {
        mode = 'friend';
        document.getElementById('friend-btn').classList.add('active');
        document.getElementById('solo-btn').classList.remove('active');
        document.getElementById('game-card').style.display = 'none';
        document.getElementById('pick-screen').classList.add('visible');
        document.getElementById('pick-input').value = '';
        document.getElementById('pick-error').textContent = '';
      });

      document.getElementById('pick-btn').addEventListener('click', () => {
        const val = parseInt(document.getElementById('pick-input').value);
        if (!val || val < 1 || val > 100) {
          document.getElementById('pick-error').textContent = 'pick a number between 1 and 100!';
          return;
        }
        secret = val;
        document.getElementById('pick-screen').classList.remove('visible');
        document.getElementById('game-card').style.display = 'flex';
        resetGameUI();
        document.getElementById('game-desc').innerHTML = `player 1 picked a number — player 2, can you guess it?! 👀`;
      });

      document.getElementById('pick-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('pick-btn').click();
      });

      document.getElementById('guess-btn').addEventListener('click', guess);
      document.getElementById('guess-input').addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
      document.getElementById('new-btn').addEventListener('click', newGame);
      document.getElementById('hint1-btn').addEventListener('click', () => useHint(1));
      document.getElementById('hint2-btn').addEventListener('click', () => useHint(2));
      document.getElementById('hint3-btn').addEventListener('click', () => useHint(3));
    </script>
  </body>
</html>
