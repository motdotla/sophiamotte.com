<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Movie Maker! 🎬</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0; font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 0.6rem; padding: 1rem; min-height: 100vh; color: #c2185b;
        user-select: none;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem; background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace; font-size: 0.85rem; font-weight: bold;
        letter-spacing: 0.1em; padding: 0.5rem 1rem; border-radius: 0.5rem;
        text-decoration: none; border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      .undo-tab {
        position: fixed; top: 1rem; right: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
        cursor: pointer;
      }
      .undo-tab:hover { background: #e91e8c; color: #fff; }
      .undo-tab:disabled { opacity: 0.4; cursor: default; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }

      /* stage */
      #stage-wrap {
        position: relative; width: min(360px, 94vw); height: min(240px, 63vw);
        border: 3px solid #e91e8c; border-radius: 1rem; overflow: hidden;
        box-shadow: 0 0 18px #ffb6d9; cursor: default;
      }
      #stage { position: absolute; inset: 0; background: linear-gradient(to bottom, #87ceeb 60%, #f5deb3); }
      .wave-layer {
        display: none; position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
        overflow: hidden; pointer-events: none;
      }
      .wave-layer.active { display: block; }
      .wave-svg { position: absolute; bottom: 0; width: 200%; animation: waveMove 2.5s linear infinite; }
      .wave-svg2 { position: absolute; bottom: 0; width: 200%; animation: waveMove 3.5s linear infinite reverse; opacity: 0.5; }
      @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .char {
        position: absolute; cursor: grab; line-height: 1;
        touch-action: none; transform: translate(-50%, -50%);
        transition: filter 0.1s;
      }
      .char.selected { filter: drop-shadow(0 0 6px #f5c800); }
      .char:active { cursor: grabbing; }
      #caption-display {
        position: absolute; bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.5); color: #fff;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.8rem; padding: 0.3rem 0.5rem; text-align: center; min-height: 1.6rem;
      }
      #playback {
        display: none; position: absolute; inset: 0;
        flex-direction: column; align-items: center; justify-content: flex-end;
        pointer-events: none;
      }
      #playback.active { display: flex; }
      #pb-caption {
        width: 100%; background: rgba(0,0,0,0.5); color: #fff;
        font-size: 0.8rem; padding: 0.3rem 0.5rem; text-align: center; min-height: 1.6rem;
      }

      /* size controls */
      #size-controls {
        display: none; gap: 0.4rem; align-items: center; justify-content: center;
        flex-wrap: wrap;
      }
      #size-controls.visible { display: flex; }
      #size-controls span { font-size: 0.8rem; color: #e91e8c99; }

      /* bg picker */
      .bg-row { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; max-width: min(360px, 94vw); }
      .bg-btn {
        font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 0.5rem;
        border: 2px solid #e91e8c; background: #fff0f5; cursor: pointer;
        color: #c2185b; font-family: "Courier New", Courier, monospace; font-weight: bold;
      }
      .bg-btn:hover, .bg-btn.active { background: #e91e8c; color: #fff; }

      /* emoji picker */
      .emoji-picker-wrap {
        width: min(360px, 94vw); background: #fff0f5;
        border: 2px solid #e91e8c; border-radius: 0.75rem;
        box-shadow: 0 0 10px #ffb6d9; overflow: hidden;
      }
      .emoji-tabs { display: flex; overflow-x: auto; border-bottom: 2px solid #e91e8c; }
      .emoji-tab {
        flex-shrink: 0; padding: 0.35rem 0.6rem; font-size: 1.1rem; cursor: pointer;
        border: none; background: none; border-bottom: 3px solid transparent;
      }
      .emoji-tab.active { border-bottom-color: #e91e8c; background: #fde8f0; }
      .emoji-grid {
        display: flex; flex-wrap: wrap; gap: 0.15rem; padding: 0.5rem;
        max-height: 140px; overflow-y: auto;
      }
      .char-pick {
        font-size: 1.6rem; cursor: pointer; padding: 0.1rem;
        border-radius: 0.3rem; transition: transform 0.1s; line-height: 1;
      }
      .char-pick:hover { transform: scale(1.25); }

      /* caption */
      .caption-row { display: flex; gap: 0.4rem; width: min(360px, 94vw); }
      .caption-row input {
        flex: 1; font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; padding: 0.4rem 0.7rem;
        border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; background: #fff0f5; outline: none;
      }

      /* buttons */
      .btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; padding: 0.45rem 0.9rem;
        cursor: pointer; letter-spacing: 0.06em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.danger { background: #fff0f5; }
      .btn.danger:hover { background: #e91e8c; color: #fff; }

      #frame-count { font-size: 0.85rem; color: #e91e8c99; }
      #delete-hint { font-size: 0.75rem; color: #e91e8c99; min-height: 1rem; text-align: center; }

      #frame-strip {
        display: flex; gap: 0.4rem; overflow-x: auto; max-width: min(360px, 94vw);
        padding: 0.3rem; scroll-behavior: smooth;
      }
      .frame-thumb {
        flex-shrink: 0; width: 60px; height: 40px; border-radius: 0.4rem;
        border: 2px solid #e91e8c; overflow: hidden; position: relative;
        cursor: pointer;
      }
      .frame-thumb:hover { border-color: #f5c800; }
      .frame-thumb .thumb-bg { position: absolute; inset: 0; }
      .frame-thumb .thumb-num {
        position: absolute; bottom: 1px; right: 3px; font-weight: bold; color: #fff;
        text-shadow: 0 0 3px #000; font-size: 0.65rem;
      }

      /* pixel emoji maker */
      .pixel-maker {
        width: min(360px, 94vw); background: #fff0f5;
        border: 2px solid #e91e8c; border-radius: 0.75rem;
        padding: 0.7rem; box-shadow: 0 0 10px #ffb6d9;
        display: flex; flex-direction: column; gap: 0.5rem; align-items: center;
      }
      .pixel-maker h3 { font-size: 0.85rem; font-weight: bold; letter-spacing: 0.08em; }
      #pixel-canvas { image-rendering: pixelated; cursor: crosshair; border: 2px solid #e91e8c; border-radius: 0.4rem; touch-action: none; }
      .pixel-colors { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
      .pixel-color {
        width: 1.6rem; height: 1.6rem; border-radius: 0.3rem;
        border: 3px solid transparent; cursor: pointer;
      }
      .pixel-color.active { border-color: #c2185b; transform: scale(1.15); }
      .pixel-color.eraser { background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0/8px 8px; }
    </style>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <button class="undo-tab" id="undo-btn" disabled>↩️ UNDO</button>
    <h1>🎬 movie maker!</h1>

    <div id="stage-wrap">
      <div id="stage"></div>
      <div class="wave-layer" id="wave-layer">
        <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,60 C150,100 350,0 600,60 C850,120 1050,20 1200,60 L1200,120 L0,120 Z" fill="rgba(30,140,255,0.55)"/>
        </svg>
        <svg class="wave-svg2" viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,80 C200,30 400,110 600,70 C800,30 1000,100 1200,60 L1200,120 L0,120 Z" fill="rgba(80,200,255,0.45)"/>
        </svg>
      </div>
      <div id="caption-display"></div>
      <div id="playback"><div id="pb-caption"></div></div>
    </div>

    <div id="delete-hint"></div>

    <!-- size controls (shown when emoji selected) -->
    <div id="size-controls">
      <span>size:</span>
      <button class="btn" id="size-down">➖</button>
      <button class="btn" id="size-up">➕</button>
      <button class="btn danger" id="delete-btn">🗑️ delete</button>
    </div>
    <div id="tone-controls" style="display:none;gap:0.3rem;align-items:center;flex-wrap:wrap;justify-content:center;">
      <span style="font-size:0.8rem;color:#e91e8c99;">skin tone:</span>
      <button class="btn" data-tone="" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="default">🫱</button>
      <button class="btn" data-tone="🏻" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="light">🏻</button>
      <button class="btn" data-tone="🏼" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="medium-light">🏼</button>
      <button class="btn" data-tone="🏽" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="medium">🏽</button>
      <button class="btn" data-tone="🏾" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="medium-dark">🏾</button>
      <button class="btn" data-tone="🏿" style="padding:0.3rem 0.5rem;font-size:0.9rem;" title="dark">🏿</button>
    </div>

    <!-- bg picker -->
    <div class="bg-row" id="bg-row"></div>
    <div class="caption-row" style="justify-content:center; gap:0.4rem;">
      <input type="color" id="color-pick" value="#87ceeb" title="pick a color!" style="width:2.4rem;height:2.4rem;border:2px solid #e91e8c;border-radius:0.5rem;cursor:pointer;padding:0.1rem;background:#fff0f5;" />
      <input id="color-text" type="text" placeholder="type a color! (e.g. purple, hotpink...)" style="flex:1;" />
      <button class="btn" id="color-go-btn">go!</button>
    </div>

    <!-- emoji picker with categories -->
    <div class="emoji-picker-wrap">
      <div class="emoji-tabs" id="emoji-tabs"></div>
      <div style="padding:0.4rem 0.4rem 0;">
        <input id="emoji-search" type="text" placeholder="🔍 search emojis..." maxlength="30"
          style="width:100%;font-family:'Courier New',monospace;font-size:0.8rem;padding:0.3rem 0.6rem;border:2px solid #e91e8c;border-radius:0.5rem;color:#c2185b;background:#fde8f0;outline:none;" />
      </div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>

    <!-- pixel emoji maker -->
    <div class="pixel-maker">
      <h3>✏️ draw your own emoji!</h3>
      <canvas id="pixel-canvas" width="256" height="256" style="width:min(220px,60vw);height:min(220px,60vw);"></canvas>
      <div class="pixel-colors" id="pixel-colors"></div>
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;">
        <button class="btn" id="pixel-add-btn">➕ add to stage!</button>
        <button class="btn" id="pixel-save-btn">💾 save to emojis!</button>
        <button class="btn danger" id="pixel-clear-btn">🗑️ clear</button>
      </div>
    </div>

    <!-- caption -->
    <div class="caption-row">
      <input id="caption-input" type="text" placeholder="type a caption..." maxlength="80" />
    </div>

    <!-- buttons -->
    <div class="btn-row">
      <button class="btn" id="snap-btn">📸 snap frame!</button>
      <button class="btn" id="play-btn" disabled>▶️ play movie!</button>
      <button class="btn danger" id="clear-stage-btn">🗑️ clear stage</button>
    </div>

    <div id="frame-count">0 frames snapped</div>
    <div id="frame-strip"></div>

    <!-- save movie -->
    <div class="caption-row" style="margin-top:0.5rem;">
      <input id="movie-name-input" type="text" placeholder="name your movie..." maxlength="40" />
      <button class="btn" id="save-movie-btn" disabled>💾 save!</button>
    </div>
    <div id="save-msg" style="font-size:0.8rem;color:#e91e8c;min-height:1rem;text-align:center;"></div>

    <!-- saved movies -->
    <div style="font-size:0.9rem;letter-spacing:0.08em;align-self:flex-start;width:min(360px,94vw);">🎥 my saved movies!</div>
    <div id="saved-movies" style="display:flex;flex-direction:column;gap:0.4rem;width:min(360px,94vw);"></div>

    <button class="btn danger" id="new-movie-btn" style="margin-top:0.5rem;">🎬 new movie</button>

        { label: '💕', name: 'hearts', emojis: ['💕','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💗','💓','💞','💖','💝','💘','❣️','💟','❤️‍🔥','❤️‍🩹','🫀','💋','👄','🫦','👅','👁️','👀','🫶','🤝','👏','🙌','👐','🤲','🙏','✌️','🤞','🤟','🤘','👈','👉','👆','👇','☝️','👍','👎','✊','👊','🤛','🤜','👋','🤚','🖐️','✋','🖖','💅','🫰','🤏','👌','🤌','🤙','💪','🦾','🦿','🦵','🦶','👣','🎉','🎊','🎁','🎀','🏳️‍🌈','🦋','🌈','🫧','🫶'] },
        { label: '➡️', name: 'arrows', emojis: ['➡️','⬅️','⬆️','⬇️','↗️','↘️','↙️','↖️','↕️','↔️','↩️','↪️','🔄','🔃','🔁','🔂','⏩','⏪','⏫','⏬','⏭️','⏮️','▶️','◀️','🔼','🔽','⏹️','⏺️','⏏️','🔛','🔜','🔚','🔝','🔙','🆗','🆕','🆙','🆒','🆓','🚩','🏁','🏳️','🎌','📍','📌','🗺️','🧭'] },
      ];

      // flat list for search
      const ALL_EMOJIS = EMOJI_CATS.flatMap(c => c.emojis);

      // skin tone utils
      const TONES = ['\u{1F3FB}','\u{1F3FC}','\u{1F3FD}','\u{1F3FE}','\u{1F3FF}'];
      function stripTone(e) { let r=e; for(const t of TONES) r=r.replaceAll(t,''); return r; }
      function applyTone(e, tone) { return stripTone(e) + tone; }

      let currentBg = BACKGROUNDS[0].style;
      let characters = [];
      let frames = [];
      let selectedId = null;
      let charIdCounter = 0;
      let playing = false;

      const stage = document.getElementById('stage');
      const stageWrap = document.getElementById('stage-wrap');
      const captionInput = document.getElementById('caption-input');
      const captionDisplay = document.getElementById('caption-display');
      const frameCount = document.getElementById('frame-count');
      const frameStrip = document.getElementById('frame-strip');
      const deleteHint = document.getElementById('delete-hint');
      const sizeControls = document.getElementById('size-controls');

      // bg buttons
      const bgRow = document.getElementById('bg-row');
      BACKGROUNDS.forEach((bg, i) => {
        const btn = document.createElement('button');
        btn.className = 'bg-btn' + (i === 0 ? ' active' : '');
        btn.textContent = bg.label;
        btn.addEventListener('click', () => {
          currentBg = bg.style;
          stage.style.background = bg.style;
          document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('wave-layer').classList.toggle('active', !!bg.wave);
        });
        bgRow.appendChild(btn);
      });
      stage.style.background = currentBg;

      // emoji picker with tabs
      const tabsEl = document.getElementById('emoji-tabs');
      const gridEl = document.getElementById('emoji-grid');
      let activeCat = 0;

      function buildEmojiGrid(catIdx, searchTerm) {
        activeCat = catIdx;
        gridEl.innerHTML = '';
        const emojis = searchTerm
          ? ALL_EMOJIS.filter(e => e.includes(searchTerm))
          : EMOJI_CATS[catIdx].emojis;
        emojis.forEach(emoji => {
          const span = document.createElement('span');
          span.className = 'char-pick';
          span.textContent = emoji;
          span.addEventListener('click', () => addChar(emoji));
          gridEl.appendChild(span);
        });
        if (!searchTerm) document.querySelectorAll('.emoji-tab').forEach((t, i) => t.classList.toggle('active', i === catIdx));
      }

      document.getElementById('emoji-search').addEventListener('input', function() {
        const q = this.value.trim();
        if (q) {
          buildEmojiGrid(activeCat === -1 ? 0 : activeCat, q);
        } else {
          if (activeCat === -1) buildMyEmojiGrid();
          else buildEmojiGrid(activeCat);
        }
      });

      EMOJI_CATS.forEach((cat, i) => {
        const tab = document.createElement('button');
        tab.className = 'emoji-tab' + (i === 0 ? ' active' : '');
        tab.textContent = cat.label;
        tab.title = cat.name;
        tab.addEventListener('click', () => { clearSearch(); buildEmojiGrid(i); });
        tabsEl.appendChild(tab);
      });

      // my emojis tab
      let myPixelEmojis = []; // array of dataURL strings
      const myEmojiTab = document.createElement('button');
      myEmojiTab.className = 'emoji-tab';
      myEmojiTab.textContent = '🖼️';
      myEmojiTab.title = 'my emojis';
      myEmojiTab.addEventListener('click', () => { clearSearch(); buildMyEmojiGrid(); });
      tabsEl.appendChild(myEmojiTab);

      function clearSearch() {
        document.getElementById('emoji-search').value = '';
      }

      function buildMyEmojiGrid() {
        activeCat = -1;
        gridEl.innerHTML = '';
        document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
        myEmojiTab.classList.add('active');
        if (myPixelEmojis.length === 0) {
          const msg = document.createElement('div');
          msg.style.cssText = 'font-size:0.75rem;color:#e91e8c99;padding:0.5rem;text-align:center;';
          msg.textContent = 'no saved emojis yet! draw one and press 💾 save to emojis!';
          gridEl.appendChild(msg);
          return;
        }
        myPixelEmojis.forEach((src, idx) => {
          const img = document.createElement('img');
          img.src = src;
          img.style.cssText = 'width:2rem;height:2rem;image-rendering:pixelated;cursor:pointer;border-radius:0.3rem;border:2px solid transparent;';
          img.title = 'click to add to stage!';
          img.addEventListener('mouseenter', () => img.style.borderColor = '#e91e8c');
          img.addEventListener('mouseleave', () => img.style.borderColor = 'transparent');
          img.addEventListener('click', () => {
            const id = ++charIdCounter;
            characters.push({ emoji: '🖼️', src, isCustom: true, x: 50, y: 50, id, size: 2.4 });
            selectedId = id;
            renderChars(); updateSizeControls();
          });
          gridEl.appendChild(img);
        });
      }

      buildEmojiGrid(0);

      function addChar(emoji) {
        const id = ++charIdCounter;
        characters.push({ emoji, x: 50, y: 50, id, size: 2.4 });
        selectedId = id;
        renderChars();
        updateSizeControls();
      }

      function updateSizeControls() {
        const ch = characters.find(c => c.id === selectedId);
        const toneEl = document.getElementById('tone-controls');
        if (ch) {
          sizeControls.classList.add('visible');
          toneEl.style.display = 'flex';
          deleteHint.textContent = `✨ selected: ${ch.emoji} — resize, recolor, or delete!`;
        } else {
          sizeControls.classList.remove('visible');
          toneEl.style.display = 'none';
          deleteHint.textContent = '';
        }
      }

      // pixel emoji maker
      const pixelCanvas = document.getElementById('pixel-canvas');
      const pixelCtx = pixelCanvas.getContext('2d');
      const GRID = 16; // 16x16 pixels
      const CELL = pixelCanvas.width / GRID;
      const PIXEL_COLORS = ['#000000','#888888','#cccccc','#ffffff','#e91e8c','#f5c800','#87ceeb','#2d6a2d','#ff7043','#4a148c','#795548','#ff80ab','#b2dfdb','#ffe082','#ef9a9a','#ce93d8','#80cbc4','#ffcc80','#a5d6a7','#90caf9'];
      let pixelColor = '#e91e8c';
      let pixelGrid = Array(GRID).fill(null).map(() => Array(GRID).fill(null));
      let pixelDrawing = false;

      // init pixel grid display
      pixelCtx.fillStyle = '#fff0f5';
      pixelCtx.fillRect(0, 0, pixelCanvas.width, pixelCanvas.height);

      // draw grid lines
      function drawPixelGrid() {
        pixelCtx.fillStyle = '#fff0f5';
        pixelCtx.fillRect(0, 0, pixelCanvas.width, pixelCanvas.height);
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            if (pixelGrid[r][c]) {
              pixelCtx.fillStyle = pixelGrid[r][c];
              pixelCtx.fillRect(c * CELL, r * CELL, CELL, CELL);
            }
          }
        }
        pixelCtx.strokeStyle = '#e91e8c22';
        pixelCtx.lineWidth = 0.5;
        for (let i = 0; i <= GRID; i++) {
          pixelCtx.beginPath(); pixelCtx.moveTo(i*CELL,0); pixelCtx.lineTo(i*CELL,pixelCanvas.height); pixelCtx.stroke();
          pixelCtx.beginPath(); pixelCtx.moveTo(0,i*CELL); pixelCtx.lineTo(pixelCanvas.width,i*CELL); pixelCtx.stroke();
        }
      }
      drawPixelGrid();

      function paintPixel(ex, ey) {
        const rect = pixelCanvas.getBoundingClientRect();
        const scaleX = pixelCanvas.width / rect.width;
        const scaleY = pixelCanvas.height / rect.height;
        const c = Math.floor((ex - rect.left) * scaleX / CELL);
        const r = Math.floor((ey - rect.top) * scaleY / CELL);
        if (c < 0 || c >= GRID || r < 0 || r >= GRID) return;
        pixelGrid[r][c] = pixelColor === 'eraser' ? null : pixelColor;
        drawPixelGrid();
      }

      pixelCanvas.addEventListener('mousedown', e => { pixelDrawing = true; paintPixel(e.clientX, e.clientY); });
      window.addEventListener('mouseup', () => pixelDrawing = false);
      pixelCanvas.addEventListener('mousemove', e => { if (pixelDrawing) paintPixel(e.clientX, e.clientY); });
      pixelCanvas.addEventListener('touchstart', e => { e.preventDefault(); pixelDrawing = true; paintPixel(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
      pixelCanvas.addEventListener('touchmove', e => { e.preventDefault(); if (pixelDrawing) paintPixel(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
      pixelCanvas.addEventListener('touchend', () => pixelDrawing = false);

      // color buttons
      const pixelColorsEl = document.getElementById('pixel-colors');
      PIXEL_COLORS.forEach(col => {
        const btn = document.createElement('div');
        btn.className = 'pixel-color' + (col === pixelColor ? ' active' : '');
        btn.style.background = col;
        if (col === '#ffffff') btn.style.border = '3px solid #e91e8c44';
        btn.addEventListener('click', () => {
          pixelColor = col;
          document.querySelectorAll('.pixel-color').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
        pixelColorsEl.appendChild(btn);
      });
      // eraser
      const eraserBtn = document.createElement('div');
      eraserBtn.className = 'pixel-color eraser';
      eraserBtn.title = 'eraser';
      eraserBtn.innerHTML = '<span style="font-size:0.9rem;line-height:1.6rem;display:block;text-align:center;">🧹</span>';
      eraserBtn.addEventListener('click', () => {
        pixelColor = 'eraser';
        document.querySelectorAll('.pixel-color').forEach(b => b.classList.remove('active'));
        eraserBtn.classList.add('active');
      });
      pixelColorsEl.appendChild(eraserBtn);

      // also add custom color picker
      const customColorInput = document.createElement('input');
      customColorInput.type = 'color'; customColorInput.value = '#ff80ab';
      customColorInput.style.cssText = 'width:1.6rem;height:1.6rem;border-radius:0.3rem;border:2px solid #e91e8c;cursor:pointer;padding:0;';
      customColorInput.addEventListener('input', () => {
        pixelColor = customColorInput.value;
        document.querySelectorAll('.pixel-color').forEach(b => b.classList.remove('active'));
      });
      pixelColorsEl.appendChild(customColorInput);

      document.getElementById('pixel-clear-btn').addEventListener('click', () => {
        pixelGrid = Array(GRID).fill(null).map(() => Array(GRID).fill(null));
        drawPixelGrid();
      });

      document.getElementById('pixel-save-btn').addEventListener('click', () => {
        const clean = document.createElement('canvas');
        clean.width = GRID * 4; clean.height = GRID * 4;
        const ctx2 = clean.getContext('2d');
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            if (pixelGrid[r][c]) {
              ctx2.fillStyle = pixelGrid[r][c];
              ctx2.fillRect(c*4, r*4, 4, 4);
            }
          }
        }
        const src = clean.toDataURL();
        myPixelEmojis.push(src);
        // flash button feedback
        const btn = document.getElementById('pixel-save-btn');
        const orig = btn.textContent;
        btn.textContent = '✅ saved!';
        setTimeout(() => btn.textContent = orig, 1200);
      });

      document.getElementById('pixel-add-btn').addEventListener('click', () => {
        // render to a clean canvas without grid lines
        const clean = document.createElement('canvas');
        clean.width = GRID * 4; clean.height = GRID * 4;
        const ctx2 = clean.getContext('2d');
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            if (pixelGrid[r][c]) {
              ctx2.fillStyle = pixelGrid[r][c];
              ctx2.fillRect(c*4, r*4, 4, 4);
            }
          }
        }
        const src = clean.toDataURL();
        const id = ++charIdCounter;
        characters.push({ emoji: '🖼️', src, isCustom: true, x: 50, y: 50, id, size: 2.4 });
        selectedId = id;
        renderChars(); updateSizeControls();
      });

      // skin tone buttons
      document.querySelectorAll('#tone-controls [data-tone]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ch = characters.find(c => c.id === selectedId);
          if (!ch) return;
          ch.emoji = applyTone(ch.emoji, btn.dataset.tone);
          renderChars(); updateSizeControls();
        });
      });

      function renderChars() {
        document.querySelectorAll('.char').forEach(el => el.remove());
        characters.forEach(ch => {
          let el;
          if (ch.isCustom) {
            el = document.createElement('img');
            el.src = ch.src;
            el.style.width = (ch.size * 16) + 'px';
            el.style.height = (ch.size * 16) + 'px';
            el.style.imageRendering = 'pixelated';
          } else {
            el = document.createElement('span');
            el.textContent = ch.emoji;
            el.style.fontSize = ch.size + 'rem';
          }
          el.className = 'char' + (ch.id === selectedId ? ' selected' : '');
          el.style.left = ch.x + '%';
          el.style.top = ch.y + '%';
          el.dataset.id = ch.id;
          makeDraggable(el, ch);
          el.addEventListener('click', e => {
            e.stopPropagation();
            selectedId = ch.id;
            renderChars();
            updateSizeControls();
          });
          stage.appendChild(el);
        });
        captionDisplay.textContent = captionInput.value;
      }

      // size buttons
      document.getElementById('size-up').addEventListener('click', () => {
        const ch = characters.find(c => c.id === selectedId);
        if (ch) { ch.size = Math.min(8, +(ch.size + 0.5).toFixed(1)); renderChars(); }
      });
      document.getElementById('size-down').addEventListener('click', () => {
        const ch = characters.find(c => c.id === selectedId);
        if (ch) { ch.size = Math.max(0.8, +(ch.size - 0.5).toFixed(1)); renderChars(); }
      });
      document.getElementById('delete-btn').addEventListener('click', () => {
        characters = characters.filter(c => c.id !== selectedId);
        selectedId = null;
        renderChars();
        updateSizeControls();
      });

      function makeDraggable(el, ch) {
        let dragging = false, startX, startY, startChX, startChY, moved = false;
        const rect = () => stageWrap.getBoundingClientRect();

        function onStart(ex, ey) {
          dragging = true; moved = false;
          startX = ex; startY = ey;
          startChX = ch.x; startChY = ch.y;
        }
        function onMove(ex, ey) {
          if (!dragging) return;
          const dx = ex - startX, dy = ey - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
          const r = rect();
          ch.x = Math.max(2, Math.min(98, startChX + (dx / r.width) * 100));
          ch.y = Math.max(2, Math.min(98, startChY + (dy / r.height) * 100));
          el.style.left = ch.x + '%';
          el.style.top = ch.y + '%';
        }
        function onEnd() { dragging = false; }

        el.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onEnd);
        el.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: false });
        el.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: false });
        el.addEventListener('touchend', onEnd);
      }

      // custom color
      const colorPick = document.getElementById('color-pick');
      const colorText = document.getElementById('color-text');
      function applyCustomColor(val) {
        const s = val.trim(); if (!s) return;
        currentBg = s; stage.style.background = s;
        document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('wave-layer').classList.remove('active');
      }
      colorPick.addEventListener('input', () => { colorText.value = ''; applyCustomColor(colorPick.value); });
      document.getElementById('color-go-btn').addEventListener('click', () => applyCustomColor(colorText.value || colorPick.value));
      colorText.addEventListener('keydown', e => { if (e.key === 'Enter') applyCustomColor(colorText.value); });

      // click stage = deselect
      stage.addEventListener('click', () => { selectedId = null; renderChars(); updateSizeControls(); });

      captionInput.addEventListener('input', () => { captionDisplay.textContent = captionInput.value; });

      function updateUndoBtn() {
        document.getElementById('undo-btn').disabled = frames.length === 0;
      }

      // undo last frame
      document.getElementById('undo-btn').addEventListener('click', () => {
        if (frames.length === 0) return;
        frames.pop();
        frameStrip.removeChild(frameStrip.lastChild);
        frameCount.textContent = frames.length === 0 ? '0 frames snapped' : `${frames.length} frame${frames.length===1?'':'s'} snapped! 📸`;
        document.getElementById('play-btn').disabled = frames.length < 2;
        updateUndoBtn();
      });

      // snap frame
      document.getElementById('snap-btn').addEventListener('click', () => {
        const frame = {
          bg: currentBg,
          characters: characters.map(c => ({...c})),
          caption: captionInput.value,
        };
        frames.push(frame);
        frameCount.textContent = `${frames.length} frame${frames.length===1?'':'s'} snapped! 📸`;
        document.getElementById('play-btn').disabled = frames.length < 2;
        addThumb(frame, frames.length);
        updateUndoBtn(); updateSaveBtn();
      });

      function addThumb(frame, num) {
        const div = document.createElement('div');
        div.className = 'frame-thumb';
        const bg = document.createElement('div');
        bg.className = 'thumb-bg'; bg.style.background = frame.bg;
        div.appendChild(bg);
        frame.characters.forEach(ch => {
          const s = document.createElement('span');
          s.style.cssText = `position:absolute;left:${ch.x}%;top:${ch.y}%;transform:translate(-50%,-50%);font-size:${Math.min(ch.size*0.35, 1.1)}rem;`;
          s.textContent = ch.emoji; div.appendChild(s);
        });
        const numEl = document.createElement('span');
        numEl.className = 'thumb-num'; numEl.textContent = num; div.appendChild(numEl);
        frameStrip.appendChild(div);
        frameStrip.scrollLeft = frameStrip.scrollWidth;
      }

      // play movie
      document.getElementById('play-btn').addEventListener('click', () => {
        if (playing || frames.length < 2) return;
        playing = true;
        document.getElementById('play-btn').disabled = true;
        document.getElementById('snap-btn').disabled = true;
        const pb = document.getElementById('playback');
        const pbCaption = document.getElementById('pb-caption');
        let i = 0;
        function showFrame() {
          if (i >= frames.length) {
            pb.classList.remove('active');
            stage.style.background = currentBg;
            renderChars(); playing = false;
            document.getElementById('play-btn').disabled = false;
            document.getElementById('snap-btn').disabled = false;
            frameCount.textContent = `${frames.length} frames — 🎬 the end!`;
            return;
          }
          const f = frames[i];
          stage.style.background = f.bg;
          document.querySelectorAll('.char').forEach(el => el.remove());
          f.characters.forEach(ch => {
            let el;
            if (ch.isCustom) {
              el = document.createElement('img');
              el.src = ch.src; el.style.width = (ch.size*16)+'px'; el.style.height = (ch.size*16)+'px'; el.style.imageRendering = 'pixelated';
            } else {
              el = document.createElement('span');
              el.textContent = ch.emoji; el.style.fontSize = ch.size+'rem';
            }
            el.className = 'char';
            el.style.left = ch.x + '%'; el.style.top = ch.y + '%';
            stage.appendChild(el);
          });
          pb.classList.add('active'); pbCaption.textContent = f.caption;
          i++; setTimeout(showFrame, 1200);
        }
        showFrame();
      });

      // clear stage
      document.getElementById('clear-stage-btn').addEventListener('click', () => {
        characters = []; selectedId = null;
        captionInput.value = ''; captionDisplay.textContent = '';
        renderChars(); updateSizeControls();
      });

      // new movie
      document.getElementById('new-movie-btn').addEventListener('click', () => {
        if (frames.length > 0 && !confirm('start a new movie? your frames will be lost!')) return;
        frames = []; characters = []; selectedId = null; charIdCounter = 0;
        captionInput.value = ''; captionDisplay.textContent = '';
        currentBg = BACKGROUNDS[0].style; stage.style.background = currentBg;
        document.querySelectorAll('.bg-btn').forEach((b,i) => b.classList.toggle('active', i===0));
        document.getElementById('wave-layer').classList.remove('active');
        frameCount.textContent = '0 frames snapped';
        frameStrip.innerHTML = '';
        document.getElementById('play-btn').disabled = true;
        document.getElementById('save-movie-btn').disabled = true;
        document.getElementById('movie-name-input').value = '';
        document.getElementById('save-msg').textContent = '';
        renderChars(); updateSizeControls();
      });

      // enable save btn when frames exist
      function updateSaveBtn() {
        document.getElementById('save-movie-btn').disabled = frames.length === 0;
      }

      // save movie
      function getSavedMovies() {
        try { return JSON.parse(localStorage.getItem('saved-movies') || '[]'); } catch { return []; }
      }
      function storeSavedMovies(list) { localStorage.setItem('saved-movies', JSON.stringify(list)); }

      document.getElementById('save-movie-btn').addEventListener('click', () => {
        const name = document.getElementById('movie-name-input').value.trim() || 'my movie';
        const saved = getSavedMovies();
        saved.unshift({ name, frames: JSON.parse(JSON.stringify(frames)), date: new Date().toLocaleDateString() });
        storeSavedMovies(saved.slice(0, 10)); // keep max 10
        document.getElementById('save-msg').textContent = `✅ "${name}" saved!!`;
        renderSavedMovies();
      });

      function renderSavedMovies() {
        const container = document.getElementById('saved-movies');
        const saved = getSavedMovies();
        container.innerHTML = '';
        if (saved.length === 0) {
          container.innerHTML = '<div style="font-size:0.8rem;color:#e91e8c99;text-align:center;">no saved movies yet! snap some frames and save! 🎬</div>';
          return;
        }
        saved.forEach((movie, i) => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;background:#fff0f5;border:2px solid #e91e8c;border-radius:0.75rem;padding:0.5rem 0.8rem;box-shadow:0 0 6px #ffb6d9;';
          row.innerHTML = `
            <span style="flex:1;font-size:0.85rem;">🎬 ${movie.name} <span style="color:#e91e8c99;font-size:0.75rem;">(${movie.frames.length} frames · ${movie.date})</span></span>
          `;
          const loadBtn = document.createElement('button');
          loadBtn.className = 'btn'; loadBtn.textContent = '▶️ load';
          loadBtn.style.fontSize = '0.75rem'; loadBtn.style.padding = '0.3rem 0.6rem';
          loadBtn.addEventListener('click', () => {
            if (frames.length > 0 && !confirm('load this movie? your current frames will be lost!')) return;
            frames = JSON.parse(JSON.stringify(movie.frames));
            frameStrip.innerHTML = '';
            frames.forEach((f, n) => addThumb(f, n + 1));
            frameCount.textContent = `${frames.length} frame${frames.length===1?'':'s'} loaded! 📽️`;
            document.getElementById('play-btn').disabled = frames.length < 2;
            document.getElementById('movie-name-input').value = movie.name;
            updateUndoBtn(); updateSaveBtn();
          });
          const delBtn = document.createElement('button');
          delBtn.className = 'btn danger'; delBtn.textContent = '🗑️';
          delBtn.style.fontSize = '0.75rem'; delBtn.style.padding = '0.3rem 0.6rem';
          delBtn.addEventListener('click', () => {
            const list = getSavedMovies(); list.splice(i, 1); storeSavedMovies(list); renderSavedMovies();
          });
          row.appendChild(loadBtn); row.appendChild(delBtn);
          container.appendChild(row);
        });
      }

      // hook save btn enable into snap
      const origSnap = document.getElementById('snap-btn').onclick;
      document.getElementById('snap-btn').addEventListener('click', updateSaveBtn);

      renderSavedMovies();
    </script>
  </body>
</html>
