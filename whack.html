<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack a Mole! 🐹</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0;
        font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .info { display: flex; gap: 2rem; font-size: 0.9rem; letter-spacing: 0.08em; }
      .grid {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 0.8rem; width: min(340px, 90vw);
      }
      .hole {
        aspect-ratio: 1; background: #fff0f5;
        border: 3px solid #e91e8c; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; cursor: pointer;
        box-shadow: 0 0 8px #ffb6d9; user-select: none;
        transition: transform 0.1s;
      }
      .hole:active { transform: scale(0.9); }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1.2rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      #message { font-size: 1rem; letter-spacing: 0.08em; min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>🐹 whack a mole!</h1>
    <div class="info">
      <span>score: <strong id="score">0</strong></span>
      <span>time: <strong id="timer">30</strong>s</span>
    </div>
    <div class="grid" id="grid"></div>
    <div id="message">press start to play!</div>
    <button class="btn" id="start-btn">▶ start!</button>

    <script>
      const holes = [];
      let score = 0, timeLeft = 30, moleTimer, countdown, activeMole = -1, running = false;

      for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.textContent = '🌿';
        hole.addEventListener('click', () => whack(i));
        document.getElementById('grid').appendChild(hole);
        holes.push(hole);
      }

      function whack(i) {
        if (!running || i !== activeMole) return;
        score++;
        document.getElementById('score').textContent = score;
        holes[i].textContent = '💥';
        setTimeout(() => { if (activeMole === i) holes[i].textContent = '🌿'; }, 200);
      }

      function showMole() {
        if (activeMole >= 0) holes[activeMole].textContent = '🌿';
        activeMole = Math.floor(Math.random() * 9);
        holes[activeMole].textContent = '🐹';
        moleTimer = setTimeout(showMole, 800);
      }

      function start() {
        score = 0; timeLeft = 30; running = true;
        document.getElementById('score').textContent = 0;
        document.getElementById('timer').textContent = 30;
        document.getElementById('message').textContent = '';
        document.getElementById('start-btn').disabled = true;
        showMole();
        countdown = setInterval(() => {
          timeLeft--;
          document.getElementById('timer').textContent = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(countdown); clearTimeout(moleTimer); running = false;
            if (activeMole >= 0) holes[activeMole].textContent = '🌿';
            activeMole = -1;
            document.getElementById('message').textContent = `time's up! you got ${score}! 🎉`;
            document.getElementById('start-btn').disabled = false;
          }
        }, 1000);
      }

      document.getElementById('start-btn').addEventListener('click', start);
    </script>
  </body>
</html>
