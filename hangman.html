<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman! ✏️</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0;
        font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem;
        background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em;
        padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none;
        border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .drawing {
        font-size: 0.85rem; line-height: 1.4; white-space: pre;
        color: #e91e8c; text-align: left;
        background: #fff0f5; border: 3px solid #e91e8c;
        border-radius: 1rem; padding: 1rem;
        box-shadow: 0 0 10px #ffb6d9;
      }
      .word-display {
        display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
      }
      .letter-box {
        width: 2rem; text-align: center; font-size: 1.4rem;
        border-bottom: 3px solid #e91e8c; color: #c2185b;
        min-height: 2rem; line-height: 2rem;
      }
      .wrong-letters { font-size: 0.85rem; color: #e91e8c99; letter-spacing: 0.1em; min-height: 1.5rem; }
      .keyboard {
        display: flex; flex-wrap: wrap; gap: 0.3rem;
        width: min(360px, 94vw); justify-content: center;
      }
      .key {
        background: #fff0f5; border: 2px solid #e91e8c; border-radius: 0.4rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem; font-weight: bold;
        padding: 0.3rem 0.5rem; cursor: pointer; min-width: 2rem; text-align: center;
      }
      .key:hover:not(:disabled) { background: #e91e8c; color: #fff; }
      .key:disabled { opacity: 0.3; cursor: default; }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1.2rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      #message { font-size: 1rem; letter-spacing: 0.05em; min-height: 1.5rem; text-align: center; }

      /* vs computer screen */
      #vs-screen {
        background: #fff0f5; border: 3px solid #e91e8c; border-radius: 1rem;
        box-shadow: 0 0 14px #ffb6d9; padding: 1.5rem;
        width: min(360px, 94vw); display: flex; flex-direction: column;
        align-items: center; gap: 1rem; text-align: center;
      }
      #vs-screen h2 { font-size: 1.1rem; font-weight: normal; letter-spacing: 0.1em; }
      #vs-screen p { font-size: 0.8rem; color: #e91e8c99; }
      #vs-word-input {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.2rem; padding: 0.5rem 1rem;
        border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; background: #fff0f5;
        text-align: center; width: 100%; outline: none;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      #computer-thinking {
        font-size: 0.9rem; color: #e91e8c; min-height: 1.5rem;
        letter-spacing: 0.05em; text-align: center; font-weight: bold;
      }

      /* friend mode screen */
      #friend-screen {
        background: #fff0f5; border: 3px solid #e91e8c; border-radius: 1rem;
        box-shadow: 0 0 14px #ffb6d9; padding: 1.5rem;
        width: min(360px, 94vw); display: flex; flex-direction: column;
        align-items: center; gap: 1rem; text-align: center;
      }
      #friend-screen h2 { font-size: 1.1rem; font-weight: normal; letter-spacing: 0.1em; }
      #friend-screen p { font-size: 0.8rem; color: #e91e8c99; }
      #word-input {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.2rem; padding: 0.5rem 1rem;
        border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; background: #fff0f5;
        text-align: center; width: 100%; outline: none;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
    </style>
    <script defer src="https://1.dotenvx.com/script.js" data-website-id="d1d69339-4912-43a7-8ee9-cbcc9a58c74f"></script>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>✏️ hangman!</h1>

    <!-- vs computer word entry screen -->
    <div id="vs-screen" style="display:none;">
      <h2>🤖 vs computer!</h2>
      <p>you pick a word and the computer tries to guess it! 👀</p>
      <input id="vs-word-input" type="password" maxlength="20" placeholder="type your word..." autocomplete="off" />
      <p id="vs-word-error" style="color:#e91e8c; min-height:1rem;"></p>
      <button class="btn" id="start-vs-btn">✅ done! let the computer guess!</button>
    </div>

    <!-- friend word entry screen -->
    <div id="friend-screen" style="display:none;">
      <h2>👫 with friends!</h2>
      <p>player 1: type your secret word! (player 2 look away! 👀)</p>
      <input id="word-input" type="password" maxlength="20" placeholder="type word here..." autocomplete="off" />
      <p id="word-error" style="color:#e91e8c; min-height:1rem;"></p>
      <button class="btn" id="start-friend-btn">✅ done! start guessing!</button>
    </div>

    <!-- game screen -->
    <div id="game-screen">
      <pre class="drawing" id="drawing"></pre>
      <div class="word-display" id="word-display"></div>
      <div class="wrong-letters">wrong: <span id="wrong"></span></div>
      <div class="keyboard" id="keyboard"></div>
      <div id="message"></div>
      <div class="btn-row">
        <button class="btn" id="new-btn">🔄 random word</button>
        <button class="btn" id="friend-btn">👫 with friends!</button>
        <button class="btn" id="vs-btn">🤖 vs computer!</button>
      </div>
    </div>

    <script>
      const words = ['DUCK','HEART','FLOWER','RAINBOW','BUTTERFLY','CUPCAKE','DRAGON','UNICORN','PRINCESS','SUNSHINE','DOLPHIN','PENGUIN','STRAWBERRY','CHOCOLATE','SPARKLE'];
      const stages = [
`  +---+
  |   |
      |
      |
      |
      |
=========`,
`  +---+
  |   |
  O   |
      |
      |
      |
=========`,
`  +---+
  |   |
  O   |
  |   |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|   |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========`];

      let word, guessed, wrong, over;

      function startGame(w) {
        word = w.toUpperCase();
        guessed = new Set();
        wrong = 0;
        over = false;
        if (vsTimer) { clearTimeout(vsTimer); vsTimer = null; }
        document.getElementById('wrong').textContent = '';
        document.getElementById('message').textContent = '';
        document.getElementById('friend-screen').style.display = 'none';
        document.getElementById('vs-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('game-screen').style.flexDirection = 'column';
        document.getElementById('game-screen').style.alignItems = 'center';
        document.getElementById('game-screen').style.gap = '1rem';
        render();
        buildKeyboard();
      }

      function newGame() {
        vsMode = false;
        const thinkEl = document.getElementById('computer-thinking');
        if (thinkEl) thinkEl.textContent = '';
        startGame(words[Math.floor(Math.random() * words.length)]);
      }

      function render() {
        document.getElementById('drawing').textContent = stages[wrong];
        const display = document.getElementById('word-display');
        display.innerHTML = '';
        [...word].forEach(l => {
          const box = document.createElement('div');
          box.className = 'letter-box';
          box.textContent = guessed.has(l) ? l : '';
          display.appendChild(box);
        });
      }

      function buildKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
          const btn = document.createElement('button');
          btn.className = 'key';
          btn.textContent = l;
          btn.disabled = vsMode;
          btn.addEventListener('click', () => guess(l, btn));
          kb.appendChild(btn);
        });
      }

      function guess(letter, btn) {
        if (over || guessed.has(letter)) return;
        guessed.add(letter);
        btn.disabled = true;
        if (word.includes(letter)) {
          render();
          if ([...word].every(l => guessed.has(l))) {
            over = true;
            document.getElementById('message').textContent = '🎉 you won!! amazing!!';
          }
        } else {
          wrong++;
          document.getElementById('wrong').textContent = [...guessed].filter(l => !word.includes(l)).join(' ');
          render();
          if (wrong >= 6) {
            over = true;
            document.getElementById('message').textContent = `😢 the word was "${word}"! try again!`;
          }
        }
      }

      document.addEventListener('keydown', e => {
        if (document.getElementById('friend-screen').style.display !== 'none') return;
        const l = e.key.toUpperCase();
        if (/^[A-Z]$/.test(l) && !over) {
          const btn = [...document.querySelectorAll('.key')].find(b => b.textContent === l);
          if (btn && !btn.disabled) guess(l, btn);
        }
      });

      document.getElementById('new-btn').addEventListener('click', newGame);

      document.getElementById('friend-btn').addEventListener('click', () => {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('friend-screen').style.display = 'flex';
        document.getElementById('word-input').value = '';
        document.getElementById('word-error').textContent = '';
      });

      // vs computer mode
      const COMPUTER_ORDER = 'ETAOINSRHLDCUMFPGWYBVKXJQZ';
      let vsMode = false;
      let vsGuessIndex = 0;
      let vsTimer = null;

      document.getElementById('vs-btn').addEventListener('click', () => {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('vs-screen').style.display = 'flex';
        document.getElementById('vs-word-input').value = '';
        document.getElementById('vs-word-error').textContent = '';
      });

      document.getElementById('start-vs-btn').addEventListener('click', () => {
        const val = document.getElementById('vs-word-input').value.trim().replace(/[^a-zA-Z]/g, '');
        if (val.length < 2) {
          document.getElementById('vs-word-error').textContent = 'please type at least 2 letters!';
          return;
        }
        startVsGame(val);
      });

      function startVsGame(w) {
        vsMode = true;
        vsGuessIndex = 0;
        if (vsTimer) clearTimeout(vsTimer);
        startGame(w);
        // add thinking label above keyboard
        let thinkEl = document.getElementById('computer-thinking');
        if (!thinkEl) {
          thinkEl = document.createElement('div');
          thinkEl.id = 'computer-thinking';
          document.getElementById('keyboard').before(thinkEl);
        }
        thinkEl.textContent = '🤖 computer is thinking...';
        // disable keyboard (computer plays)
        document.querySelectorAll('.key').forEach(b => b.disabled = true);
        scheduleComputerGuess();
      }

      function scheduleComputerGuess() {
        vsTimer = setTimeout(doComputerGuess, 1200);
      }

      function doComputerGuess() {
        if (over) return;
        // find next unguessed letter in order
        while (vsGuessIndex < COMPUTER_ORDER.length && guessed.has(COMPUTER_ORDER[vsGuessIndex])) {
          vsGuessIndex++;
        }
        if (vsGuessIndex >= COMPUTER_ORDER.length) return;
        const letter = COMPUTER_ORDER[vsGuessIndex];
        vsGuessIndex++;

        const thinkEl = document.getElementById('computer-thinking');
        thinkEl.textContent = `🤖 computer guesses... ${letter}!`;

        // apply guess manually
        guessed.add(letter);
        if (word.includes(letter)) {
          render();
          if ([...word].every(l => guessed.has(l))) {
            over = true;
            thinkEl.textContent = '';
            document.getElementById('message').textContent = '🤖 computer figured it out!! better luck next time! 😄';
            return;
          }
        } else {
          wrong++;
          document.getElementById('wrong').textContent = [...guessed].filter(l => !word.includes(l)).join(' ');
          render();
          if (wrong >= 6) {
            over = true;
            thinkEl.textContent = '';
            document.getElementById('message').textContent = `🎉 you beat the computer!! it couldn't guess "${word}"!! amazing!!`;
            return;
          }
        }
        scheduleComputerGuess();
      }

      document.getElementById('start-friend-btn').addEventListener('click', () => {
        const val = document.getElementById('word-input').value.trim().replace(/[^a-zA-Z]/g, '');
        if (val.length < 2) {
          document.getElementById('word-error').textContent = 'please type at least 2 letters!';
          return;
        }
        startGame(val);
      });

      newGame();
    </script>
  </body>
</html>
