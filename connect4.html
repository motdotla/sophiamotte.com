<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four! 🔴</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #fde8f0; font-family: "Courier New", Courier, monospace;
        display: flex; flex-direction: column; align-items: center;
        gap: 1rem; padding: 1rem; min-height: 100vh; color: #c2185b;
      }
      .back-tab {
        position: fixed; top: 1rem; left: 1rem; background: #f5c800; color: #c2185b;
        font-family: "Courier New", Courier, monospace; font-size: 0.85rem; font-weight: bold;
        letter-spacing: 0.1em; padding: 0.5rem 1rem; border-radius: 0.5rem;
        text-decoration: none; border: 2px solid #e91e8c; box-shadow: 0 0 10px #ffb6d9; z-index: 10;
      }
      .back-tab:hover { background: #e91e8c; color: #fff; }
      h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.15em; margin-top: 3.5rem; }
      .mode-btns { display: flex; gap: 0.5rem; }
      .btn {
        background: #f5c800; border: 2px solid #e91e8c; border-radius: 0.5rem;
        color: #c2185b; font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem; font-weight: bold; padding: 0.5rem 1.2rem;
        cursor: pointer; letter-spacing: 0.08em;
      }
      .btn:hover { background: #e91e8c; color: #fff; }
      .btn.active { background: #e91e8c; color: #fff; }
      #status { font-size: 1rem; letter-spacing: 0.05em; min-height: 1.5rem; text-align: center; }
      .board-wrap { background: #e91e8c; padding: 0.5rem; border-radius: 1rem; box-shadow: 0 0 20px #ffb6d9; }
      .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
      .col-btns { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; width: 100%; }
      .col-btn {
        background: transparent; border: none; cursor: pointer;
        font-size: 1.2rem; padding: 0.2rem; text-align: center;
      }
      .col-btn:hover { transform: scale(1.3); }
      .cell {
        width: clamp(36px, 10vw, 52px); height: clamp(36px, 10vw, 52px);
        border-radius: 50%; background: #fde8f0;
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        transition: background 0.3s;
      }
      .cell.p1 { background: #f5c800; }
      .cell.p2 { background: #fff; }
      .cell.win { box-shadow: 0 0 12px #fff, inset 0 0 4px rgba(0,0,0,0.1); animation: pulse 0.5s infinite alternate; }
      @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
      .score { font-size: 0.85rem; color: #e91e8c99; }
    </style>
  </head>
  <body>
    <a class="back-tab" href="index.html">💕 GO BACK</a>
    <h1>🔴 connect four!</h1>
    <div class="mode-btns">
      <button class="btn active" id="vs-friend-btn">👫 2 players</button>
      <button class="btn" id="vs-cpu-btn">🤖 vs computer</button>
    </div>
    <div class="score">💛 P1: <span id="s1">0</span> &nbsp;|&nbsp; 🤍 P2: <span id="s2">0</span></div>
    <div id="status">💛 player 1's turn!</div>
    <div class="col-btns" id="col-btns"></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <button class="btn" id="reset-btn">🔄 new game</button>

    <script>
      const ROWS = 6, COLS = 7;
      let grid, current, over, vsComputer, scores = [0,0];

      function init(mode) {
        vsComputer = mode === 'cpu';
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        current = 1; over = false;
        document.getElementById('status').textContent = '💛 player 1\'s turn!';
        render();
      }

      function render() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell' + (grid[r][c] === 1 ? ' p1' : grid[r][c] === 2 ? ' p2' : '');
            cell.id = `cell-${r}-${c}`;
            board.appendChild(cell);
          }
        }
        const colBtns = document.getElementById('col-btns');
        colBtns.innerHTML = '';
        for (let c = 0; c < COLS; c++) {
          const btn = document.createElement('button');
          btn.className = 'col-btn';
          btn.textContent = '⬇️';
          btn.addEventListener('click', () => drop(c));
          colBtns.appendChild(btn);
        }
      }

      function drop(col) {
        if (over) return;
        let row = -1;
        for (let r = ROWS-1; r >= 0; r--) {
          if (!grid[r][col]) { row = r; break; }
        }
        if (row === -1) return;
        grid[row][col] = current;
        const win = checkWin(row, col);
        render();
        if (win) {
          over = true;
          scores[current-1]++;
          document.getElementById(`s${current}`).textContent = scores[current-1];
          document.getElementById('status').textContent = `${current === 1 ? '💛 player 1' : '🤍 player 2'} wins!! 🎉`;
          win.forEach(([r,c]) => document.getElementById(`cell-${r}-${c}`).classList.add('win'));
          return;
        }
        if (grid[0].every((_,c) => grid[0][c] !== 0)) {
          over = true;
          document.getElementById('status').textContent = "it's a tie! 🤝";
          return;
        }
        current = current === 1 ? 2 : 1;
        document.getElementById('status').textContent = `${current === 1 ? '💛 player 1' : '🤍 player 2'}'s turn!`;
        if (vsComputer && current === 2 && !over) setTimeout(cpuDrop, 400);
      }

      function cpuDrop() {
        // try to win, block, else random
        for (const p of [2,1]) {
          for (let c = 0; c < COLS; c++) {
            const testGrid = grid.map(r => [...r]);
            for (let r = ROWS-1; r >= 0; r--) {
              if (!testGrid[r][c]) { testGrid[r][c] = p; break; }
            }
            const row = grid.map((r,i) => r[c] === 0 ? i : -1).filter(i=>i>=0).pop();
            if (row !== undefined) {
              const tg = grid.map(r=>[...r]); tg[row][c] = p;
              if (checkWinGrid(tg, row, c, p)) { drop(c); return; }
            }
          }
        }
        const valid = [...Array(COLS).keys()].filter(c => grid[0][c] === 0);
        drop(valid[Math.floor(Math.random() * valid.length)]);
      }

      function checkWin(row, col) {
        return checkWinGrid(grid, row, col, current);
      }

      function checkWinGrid(g, row, col, p) {
        const dirs = [[0,1],[1,0],[1,1],[1,-1]];
        for (const [dr,dc] of dirs) {
          let cells = [[row,col]];
          for (const sign of [1,-1]) {
            let r=row+dr*sign, c=col+dc*sign;
            while (r>=0&&r<ROWS&&c>=0&&c<COLS&&g[r][c]===p) {
              cells.push([r,c]); r+=dr*sign; c+=dc*sign;
            }
          }
          if (cells.length >= 4) return cells;
        }
        return null;
      }

      document.getElementById('vs-friend-btn').addEventListener('click', () => {
        document.getElementById('vs-friend-btn').classList.add('active');
        document.getElementById('vs-cpu-btn').classList.remove('active');
        init('friend');
      });
      document.getElementById('vs-cpu-btn').addEventListener('click', () => {
        document.getElementById('vs-cpu-btn').classList.add('active');
        document.getElementById('vs-friend-btn').classList.remove('active');
        init('cpu');
      });
      document.getElementById('reset-btn').addEventListener('click', () => init(vsComputer ? 'cpu' : 'friend'));
      init('friend');
    </script>
  </body>
</html>
